spring.application.name=llm-lab-service
server.port=${LLM_LAB_SERVICE_PORT:8083}

# Database Configuration - code_training schema
# NEW: Points to dedicated llm_training_db instead of shared llm_data
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/llm_training_db}
spring.datasource.username=${POSTGRES_USER:llm_user}
spring.datasource.password=${POSTGRES_PASSWORD:llm_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.properties.hibernate.default_schema=code_training

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0

# Runtime Service for eval calls
runtime.service.base-url=${RUNTIME_SERVICE_BASE_URL:http://localhost:8082}

# Logging
logging.level.root=INFO
logging.level.com.digested.llm.lab=DEBUG
logging.file.name=${LOG_FILE:logs/llm-lab-service.log}
